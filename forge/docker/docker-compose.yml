services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - forge_net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FORGE_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ..:/forge
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forge_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - forge_net

  node-1:
    image: alpine:latest
    command: ["sleep", "infinity"]
    networks:
      - forge_net

  node-2:
    image: alpine:latest
    command: ["sleep", "infinity"]
    networks:
      - forge_net

  node-3:
    image: alpine:latest
    command: ["sleep", "infinity"]
    networks:
      - forge_net

networks:
  forge_net:
    driver: bridge
